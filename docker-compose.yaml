services:

  # ==========================================
  # MYSQL PRIMARY DATABASE
  # ==========================================

  mysql-primary:
    build:
      context: ./mysql/primary
      dockerfile: Dockerfile

    container_name: url-shortener-mysql-primary

    environment:
      MYSQL_ROOT_PASSWORD: Yogeshbhatt@2003
      MYSQL_DATABASE: url_shortener

    ports:
      - "3307:3306"

    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql/primary/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pYogeshbhatt@2003"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

    networks:
      - url-shortener-network


  # ==========================================
  # MYSQL REPLICA DATABASE
  # ==========================================

  mysql-replica:
    build:
      context: ./mysql/replica
      dockerfile: Dockerfile

    container_name: url-shortener-mysql-replica

    environment:
      MYSQL_ROOT_PASSWORD: Yogeshbhatt@2003
      MYSQL_DATABASE: url_shortener

    ports:
      - "3308:3306"

    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./mysql/replica/init.sql:/docker-entrypoint-initdb.d/init.sql

    depends_on:
      mysql-primary:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pYogeshbhatt@2003"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

    networks:
      - url-shortener-network


  # ==========================================
  # REDIS
  # ==========================================

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - url-shortener-network


  # ==========================================
  # SPRING BOOT APPLICATION - INSTANCE 1
  # ==========================================

  app-1:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-app-1

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql-primary:3306/url_shortener?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql-primary:
        condition: service_healthy

      mysql-replica:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - url-shortener-network


  # ==========================================
  # SPRING BOOT APPLICATION - INSTANCE 2
  # ==========================================

  app-2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-app-2

    expose:
      - "8080"

    environment:
      DB_URL: jdbc:mysql://mysql-primary:3306/url_shortener?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql-primary:
        condition: service_healthy

      mysql-replica:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - url-shortener-network


  # ==========================================
  # SPRING BOOT APPLICATION - INSTANCE 3
  # ==========================================

  app-3:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-app-3

    expose:
      - "8080"

    environment:
      DB_URL: jdbc:mysql://mysql-primary:3306/url_shortener?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql-primary:
        condition: service_healthy

      mysql-replica:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - url-shortener-network


  # ==========================================
  # NGINX LOAD BALANCER
  # ==========================================

  nginx:
    image: nginx:latest

    container_name: url-shortener-nginx

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app-1
      - app-2
      - app-3

    networks:
      - url-shortener-network


# ==========================================
# NETWORK
# ==========================================

networks:

  url-shortener-network:
    driver: bridge


# ==========================================
# PERSISTENT VOLUMES
# ==========================================

volumes:

  mysql_primary_data:

  mysql_replica_data:

  redis_data:

